  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] !== undefined) el.textContent = I18N[lang][key];

  if (typeof renderAll === 'function') renderAll();
}
window.setLang = setLang;

<script>
// ============ Rendering ============
const SCENE_LABELS = {
  zh: { club: '🎧 俱乐部', festival: '🎪 音乐节', stream: '📡 直播' },
  en: { club: '🎧 CLUB', festival: '🎪 FESTIVAL', stream: '📡 STREAM' },
};

function featureCard(f) {
  const t = I18N[currentLang];
  const sceneTags = f.scenes.map(s => `<span class="scene-chip scene-${s}">${SCENE_LABELS[currentLang][s]}</span>`).join('');
  const statusLabel = t['status_' + f.status];
  const visible = currentScene === 'all' || f.scenes.includes(currentScene);
  return `
    <div class="feature-card ${visible ? '' : 'hidden-scene'} glass rounded-2xl p-5 border border-white/10"
         data-id="${f.id}" onmousemove="cardMouseMove(event,this)" onclick="openDrawer('${f.id}')">
      <div class="flex items-start justify-between mb-3">
        <div class="text-5xl" style="filter: drop-shadow(0 0 12px ${f.colors[0]})">${f.icon}</div>
        <span class="tag status-${f.status}">${statusLabel}</span>
      </div>
      <h3 class="font-display font-black text-lg leading-tight" style="background: linear-gradient(90deg, ${f.colors[0]}, ${f.colors[1]}); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">${t[f.id + '_name']}</h3>
      <p class="text-neon-purple font-mono text-[11px] mt-1 leading-tight">${t[f.id + '_tagline']}</p>
      <p class="text-neutral-400 text-xs mt-3 leading-relaxed line-clamp-3">${t[f.id + '_desc']}</p>
      <div class="flex flex-wrap gap-1 mt-4">${sceneTags}</div>
    </div>`;
}

function cardMouseMove(e, el) {
  const r = el.getBoundingClientRect();
  el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  el.style.setProperty('--my', (e.clientY - r.top) + 'px');
}
window.cardMouseMove = cardMouseMove;

function renderSections() {
  const t = I18N[currentLang];
  const html = SECTIONS.map(sec => {
    const feats = FEATURES.filter(f => f.section === sec.id);
    const visible = feats.filter(f => currentScene === 'all' || f.scenes.includes(currentScene));
    if (visible.length === 0 && currentScene !== 'all') return '';
    const cards = feats.map(featureCard).join('');
    return `
      <section class="mb-10">
        <div class="section-divider">
          <span class="text-3xl">${sec.icon}</span>
          <div>
            <h3 class="font-display font-black text-xl tracking-widest">
              <span class="text-neon-pink neon-text">${t['sec_' + sec.id]}</span>
            </h3>
            <p class="text-[11px] text-neutral-500 font-mono mt-1">${t['sec_' + sec.id + '_sub']}</p>
          </div>
          <div class="line"></div>
          <span class="text-xs font-mono text-neon-purple">${visible.length} / ${feats.length}</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>
      </section>`;
  }).join('');
  document.getElementById('sections').innerHTML = html;
}

function renderStats() {
  const t = I18N[currentLang];
  const total = FEATURES.length;
  const clubN = FEATURES.filter(f => f.scenes.includes('club')).length;
  const festN = FEATURES.filter(f => f.scenes.includes('festival')).length;
  const streamN = FEATURES.filter(f => f.scenes.includes('stream')).length;
  document.getElementById('stats-bar').innerHTML = `
    <div><span class="text-neutral-500">${t.stat_total}:</span> <span class="text-neon-pink font-bold ml-1">${total}</span></div>
    <div><span class="text-neutral-500">${t.stat_club}:</span> <span class="text-neon-pink font-bold ml-1">${clubN}</span></div>
    <div><span class="text-neutral-500">${t.stat_festival}:</span> <span class="text-neon-blue font-bold ml-1">${festN}</span></div>
    <div><span class="text-neutral-500">${t.stat_stream}:</span> <span class="text-neon-green font-bold ml-1">${streamN}</span></div>
  `;
}

function renderAll() { renderSections(); renderStats(); }
window.renderAll = renderAll;

// ============ Drawer (detail popup) ============
function openDrawer(id) {
  const f = FEATURES.find(x => x.id === id);
  if (!f) return;
  const t = I18N[currentLang];
  document.getElementById('drawer-icon').textContent = f.icon;
  document.getElementById('drawer-icon').style.filter = `drop-shadow(0 0 16px ${f.colors[0]})`;
  const titleEl = document.getElementById('drawer-title');
  titleEl.textContent = t[id + '_name'];
  titleEl.style.background = `linear-gradient(90deg, ${f.colors[0]}, ${f.colors[1]})`;
  titleEl.style.webkitBackgroundClip = 'text';
  titleEl.style.webkitTextFillColor = 'transparent';
  titleEl.style.backgroundClip = 'text';
  document.getElementById('drawer-sub').textContent = t[id + '_tagline'];
  const features = [1,2,3,4,5,6].map(i => t[id + '_f' + i]).filter(Boolean);
  document.getElementById('drawer-content').innerHTML = `
    <p class="text-neutral-300 text-sm leading-relaxed mb-5">${t[id + '_desc']}</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <div class="text-[10px] font-mono text-neon-purple uppercase tracking-widest mb-3">★ ${t.features}</div>
        <div class="space-y-2">
          ${features.map(ft => `<div class="flex gap-2 items-start text-xs"><span style="color: ${f.colors[0]}">▸</span><span class="text-neutral-300 leading-relaxed">${ft}</span></div>`).join('')}
        </div>
      </div>
      <div>
        <div class="text-[10px] font-mono text-neon-blue uppercase tracking-widest mb-3">⚙ ${t.tech}</div>
        <div class="glass rounded-lg p-3 border border-neon-blue/20">
          <code class="text-xs text-neon-blue leading-relaxed block" style="white-space: pre-wrap">${t[id + '_tech']}</code>
        </div>
        <div class="text-[10px] font-mono text-neutral-500 uppercase tracking-widest mt-5 mb-3">◆ ${t.scenes}</div>
        <div class="flex flex-wrap gap-2">
          ${f.scenes.map(s => `<span class="scene-chip scene-${s}" style="padding: 6px 12px; font-size: 11px">${SCENE_LABELS[currentLang][s]}</span>`).join('')}
        </div>
      </div>
    </div>`;
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
window.openDrawer = openDrawer;
window.closeDrawer = closeDrawer;

// Close drawer on Escape or outside click
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
document.getElementById('drawer').addEventListener('click', e => {
  if (e.target.id === 'drawer') closeDrawer();
});

// ============ Scene filter tabs ============
document.querySelectorAll('#scene-tabs .scene-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#scene-tabs .scene-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentScene = btn.dataset.scene;
    renderAll();
  });
});

// Init
setLang(currentLang);
renderAll();
</script>
