      </div>

      <!-- Cue list -->
      <div class="text-xs text-neon-purple font-mono uppercase tracking-wider mb-2">${t.hc_hot_cues}</div>
      <div class="grid grid-cols-4 gap-2">
        ${cues.map(c => `
        <div class="flex items-center gap-2 p-2 rounded glass border border-white/10 text-xs font-mono">
          <div class="w-6 h-6 rounded flex items-center justify-center font-display font-black text-[11px]" style="background: ${c.color}; color: #000">${c.n}</div>
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-white truncate" style="color: ${c.color}">${t[c.k]}</div>
            <div class="text-neutral-500 text-[10px]">${c.time}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>

    <!-- Export actions -->
    <div class="flex gap-2">
      <button class="flex-1 px-4 py-3 rounded-lg bg-gradient-to-r from-neon-pink to-neon-purple text-white font-display font-bold text-sm pulse-glow">💾 ${t.hc_write_rb}</button>
      <button class="flex-1 px-4 py-3 rounded-lg border border-neon-blue/40 text-neon-blue font-display font-bold text-sm">↓ ${t.hc_export_xml}</button>
    </div>
  </div>`;
};

// ============ Navigation + init ============
function renderView(id) {
  currentView = id;
  document.getElementById('main-view').innerHTML = views[id] ? views[id]() : '';
}

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => {
      b.classList.remove('active', 'bg-neon-pink/10', 'border', 'border-neon-pink/40');
      b.style.boxShadow = '';
    });
    btn.classList.add('active', 'bg-neon-pink/10', 'border', 'border-neon-pink/40');
    btn.style.boxShadow = '0 0 15px rgba(255, 46, 166, 0.25)';
    renderView(btn.dataset.view);
  });
});

// Init
const firstBtn = document.querySelector('.tool-btn.active');
firstBtn.classList.add('bg-neon-pink/10', 'border', 'border-neon-pink/40');
firstBtn.style.boxShadow = '0 0 15px rgba(255, 46, 166, 0.25)';
setLang(currentLang);
</script>
</body>
</html>
